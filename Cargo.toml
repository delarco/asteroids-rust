[package]
name = "asteroids-rust"
version = "0.1.0"
edition = "2024"

authors = ["Leandro Del Arco <leandrodelarco@outlook.com>"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "An asteroids clone."
repository = "https://github.com/delarco/asteroids-rust"
keywords = ["asteroids", "bevy"]
categories = ["games"]

[dependencies]
bevy = { version = "0.20.0", features = ["wav"] }
rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
